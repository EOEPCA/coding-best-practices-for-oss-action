name: 'Coding Best Practices for Open Source Software'
description: 'Checks if a project complies with coding best practices'
inputs:
  path-to-check:
    description: 'Directory to check'
    required: false
    default: '.'
  default-anchor-file:
    description: 'Default anchor file for issues not related to specific files'
    required: false
    default: 'coding-best-practices-issues.md'
  output-file:
    description: 'Report (output) file name'
    required: false
    default: 'coding-best-practices-report.json'
  output-format:
    description: 'Output report format: "generic" (SonarQube), "sarif" (v2.1.0), or "text'
    required: false
    default: 'generic'
  config-file:
    description: 'YAML file enabling/disabling rules and overriding severities'
    required: false
    default: ''
  verbose:
    description: 'Enable debug logging'
    required: false
    default: 'false'
  ai-model-provider:
    description: 'Free name of the model provider (e.g. Google, OpenAPI, Anthropic, Ollama)'
    required: false
    default: ''
  ai-model-base-url:
    description: 'OpenAI SDK compliant base URL (e.g. https://api.anthropic.com/v1)'
    required: false
    default: ''
  ai-model-api-key:
    description: 'API key giving access to the model'
    required: false
    default: ''
  ai-model-name:
    description: 'Name of the model to use within the provider (e.g. claude-sonnet-4.6, gpt-4o, qwen2.5-coder:14B)'
    required: false
    default: ''
runs:
  using: 'docker'
  image: 'Dockerfile'
  env:
    PATH_TO_CHECK: ${{ inputs.path-to-check }}
    DEFAULT_ANCHOR_FILE: ${{ inputs.default-anchor-file }}
    OUTPUT_FILE: ${{ inputs.output-file }}
    OUTPUT_FORMAT: ${{ inputs.output-format }}
    CONFIG_FILE: ${{ inputs.config-file }}
    VERBOSE: ${{ inputs.verbose }}
    AI_MODEL_PROVIDER: ${{ inputs.ai-model-provider }}
    AI_MODEL_BASE_URL: ${{ inputs.ai-model-base-url }}
    AI_MODEL_API_KEY: ${{ inputs.ai-model-api-key }}
    AI_MODEL_NAME: ${{ inputs.ai-model-name }}