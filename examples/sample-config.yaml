# examples/sample-config.yaml
# Severities: INFO, MINOR, MAJOR, CRITICAL and BLOCKER
rules:
  # Enable/disable and configure rules individually
  DOC001:
    # Presence of a README file
    enabled: true
    severity: MINOR
  DOC002:
    # Documentation content
    enabled: true
    severity: MINOR
    # Documentation files sent to the model per query (default: 8)
    max_files: 8
    # Documentation files analyzed in total (READMEs and docs/ first) (default: 40)
    max_total_files: 40
    # Characters sent per documentation file (default: 8000)
    max_chars: 8000
  SEC001:
    enabled: false
    severity: CRITICAL
  LNG001:
    # Exotic languages
    enabled: true
    severity: MINOR
    # Safety cap on number of files sent to Claude (default: 20)
    max_files: 20
    # Number of lines to extract per file (default: 5)
    lines: 5
  LNG002:
    # Too many languages
    enabled: true
    severity: MINOR
    # Safety cap on number of files sent to Claude (default: 20)
    max_files: 20
    # Number of lines to extract per file (default: 5)
    lines: 5
    # A null value means the corresponding severity is not used
    warning_threshold: 10
    error_threshold: 20
    critical_threshold: null
  RES001:
    # Do not use print/pprint
    enabled: true
    # Should the print/pprint calls be ignored in main entry points (TBW)
    ignore_print_in_main: true
  MNT001:
    # Stale TODO/FIXME comments
    enabled: true
    severity: MINOR
    # Limit above which a warning is generated (default: 180)
    warning_threshold: 180  # days
    # Limit above which an error is generated (default: 365)
    error_threshold: 365  # days
    # Limit above which a critical issue is generated (default: null = ignored)
    critical_threshold: null  # days
categories:
  # Allows disabling all the rules belonging to the same category at once
  documentation:
    enabled: true
  security:
    enabled: true
  style:
    enabled: false
  maintainability:
    enabled: true
dependencies:
  # Allows disabling all the rules having specific dependencies at once
  ai:
    enabled: true
  ruff:
    enabled: true
  flake8:
    enabled: true
  git:
    enabled: true